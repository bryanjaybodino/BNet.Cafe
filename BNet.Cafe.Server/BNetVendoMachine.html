<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BNet Cafe Vendo Machine</title>
    <style>

        /* Disable text selection and browser interactions */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: pan-y;
        }


        /* --- Fullscreen Wallpaper Slider --- */
        .slider-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: brightness(0.65) contrast(1.1);
        }

            .slide.active {
                opacity: 1;
            }

        .vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }


        /* --- Perfectly Centered PSP Carousel Viewport --- */
        .psp-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            cursor: grab;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

            .psp-container:active {
                cursor: grabbing;
            }

        .psp-carousel {
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            padding-left: 0px;
        }


        /* --- Fully Responsive Cards --- */
        .psp-card {
            width: clamp(140px, 38vw, 240px);
            height: clamp(200px, 55vh, 340px);
            border-radius: clamp(14px, 3vw, 24px);
            background-color: rgba(26, 29, 38, 0.92);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 2vh, 20px) clamp(8px, 2vw, 16px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            opacity: 0.45;
            -webkit-transform: scale(0.85);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, border-color 0.4s ease;
            flex-shrink: 0;
            pointer-events: auto;
            cursor: pointer;
        }

            .psp-card.active {
                opacity: 1;
                -webkit-transform: scale(1.05);
                transform: scale(1.05);
                border-color: rgba(255, 255, 255, 0.95);
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.3), 0 15px 35px rgba(0, 0, 0, 0.8);
                background-color: rgba(35, 40, 52, 0.95);
            }


            /* --- Status Borders & Badges --- */
            .psp-card.status-administrator {
                border-color: rgba(155, 89, 182, 0.6);
            }

            .psp-card.status-paused {
                border-color: rgba(230, 126, 34, 0.6);
            }

            .psp-card.status-occupied {
                border-color: rgba(231, 76, 60, 0.6);
            }

            .psp-card.status-available {
                border-color: rgba(46, 204, 113, 0.6);
            }

            .psp-card.status-offline {
                border-color: rgba(127, 140, 141, 0.6);
            }

            .psp-card.active.status-administrator {
                border-color: #9b59b6;
                box-shadow: 0 0 25px rgba(155, 89, 182, 0.5), 0 15px 35px rgba(0, 0, 0, 0.8);
            }

            .psp-card.active.status-paused {
                border-color: #e67e22;
                box-shadow: 0 0 25px rgba(230, 126, 34, 0.5), 0 15px 35px rgba(0, 0, 0, 0.8);
            }

            .psp-card.active.status-occupied {
                border-color: #e74c3c;
                box-shadow: 0 0 25px rgba(231, 76, 60, 0.5), 0 15px 35px rgba(0, 0, 0, 0.8);
            }

            .psp-card.active.status-available {
                border-color: #2ecc71;
                box-shadow: 0 0 25px rgba(46, 204, 113, 0.5), 0 15px 35px rgba(0, 0, 0, 0.8);
            }

            .psp-card.active.status-offline {
                border-color: #7f8c8d;
                box-shadow: 0 0 25px rgba(127, 140, 141, 0.5), 0 15px 35px rgba(0, 0, 0, 0.8);
            }

        .pc-icon {
            width: clamp(36px, 8vw, 60px);
            height: clamp(36px, 8vw, 60px);
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: clamp(1rem, 2.8vw, 1.6rem);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pc-title {
            font-size: clamp(1rem, 3.5vw, 1.8rem);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .pc-details {
            font-size: clamp(0.6rem, 1.6vw, 0.85rem);
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            line-height: 1.3;
            text-align: center;
        }

        .psp-badge {
            padding: clamp(3px, 0.6vh, 6px) clamp(8px, 2vw, 16px);
            border-radius: 20px;
            font-size: clamp(0.55rem, 1.4vw, 0.75rem);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
        }

            .psp-badge.status-administrator {
                background: #9b59b6;
                box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);
            }

            .psp-badge.status-paused {
                background: #e67e22;
                box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
            }

            .psp-badge.status-occupied {
                background: #e74c3c;
                box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
            }

            .psp-badge.status-available {
                background: #2ecc71;
                box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
            }

            .psp-badge.status-offline {
                background: #7f8c8d;
                box-shadow: 0 4px 10px rgba(127, 140, 141, 0.3);
            }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: clamp(0.85rem, 2vw, 1rem);
            z-index: 5;
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 10px;
        }

        @media (max-aspect-ratio: 1/1) {
            .psp-card {
                width: clamp(160px, 50vw, 220px);
                height: clamp(250px, 45vh, 320px);
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="slider-container" id="slider">
        <div class="loading" id="loadingText">Scanning wallpapers...</div>
    </div>

    <div class="vignette-overlay"></div>

    <div class="psp-container" id="pspContainer">
        <div class="psp-carousel" id="pspCarousel"></div>
    </div>

    <script>
        // --- 1. PROTECTIONS ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());

        document.addEventListener('keydown', e => {
            if (
                e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 67 || e.keyCode === 65))
            ) {
                e.preventDefault();
                return false;
            }
        });

        // --- 2. DYNAMIC WALLPAPER DISCOVERY & SLIDER ---
        const folderPath = 'Uploads/Wallpapers/';
        const imageExtensions = ['.png', '.jpg', '.jpeg', '.webp'];
        const sliderContainer = document.getElementById('slider');
        const loadingText = document.getElementById('loadingText');

        let validImages = [];
        let slideIndex = 0;

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        async function discoverImages() {
            let index = 1;
            while (true) {
                let found = false;
                for (const ext of imageExtensions) {
                    const testPath = `${folderPath}${index}${ext}`;
                    if (await checkImageExists(testPath)) {
                        validImages.push(testPath);
                        found = true;
                        break;
                    }
                }
                if (!found) break;
                index++;
            }

            if (validImages.length > 0) {
                if (loadingText) loadingText.remove();
                initSlider();
            } else {
                if (loadingText) loadingText.innerText = 'No wallpapers found in Uploads/Wallpapers/';
            }
        }

        function initSlider() {
            validImages.forEach((src, idx) => {
                const slide = document.createElement('div');
                slide.classList.add('slide');
                if (idx === 0) slide.classList.add('active');
                slide.style.backgroundImage = `url('${src}')`;
                sliderContainer.appendChild(slide);
            });

            if (validImages.length > 1) {
                setInterval(nextSlide, 10000);
            }
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
        }

        // --- 3. STATUS CALCULATION ---
        function getClientStatus(client) {
            if (!client) return "Offline";

            if (client.TimeStart && client.TimeStart.trim() !== "") {
                const start = Date.parse(client.TimeStart);
                const end = Date.parse(client.TimeEnd);

                if (!isNaN(start)) {
                    let hours = 0;
                    if (!isNaN(end)) {
                        const durationMs = end - start;
                        hours = Math.floor(durationMs / (1000 * 60 * 60));
                    }

                    const isAdministrator = (hours === 100);

                    if (isAdministrator) {
                        return "Administrator";
                    } else {
                        const isPaused = String(client.IsPaused).toUpperCase() === "TRUE";
                        return isPaused ? "Paused" : "Occupied";
                    }
                }
            }

            return "Available";
        }

        // --- 4. FETCH CLIENT DATA & CAROUSEL RENDERING ---
        const pspContainer = document.getElementById('pspContainer');
        const pspCarousel = document.getElementById('pspCarousel');
        let selectedIndex = 0;
        let clientData = [];
        let filteredClientData = [];

        async function fetchClientData() {
            try {
                const endpoint = window.location.protocol + '//' + window.location.hostname + ':2050/text';
                const response = await fetch(endpoint);
                let data = await response.text();
                try {
                    data = JSON.parse(data);
                } catch (e) { }

                if (Array.isArray(data) && JSON.stringify(data) !== JSON.stringify(clientData)) {
                    clientData = data;
                    renderPSPMenu();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderPSPMenu() {
            pspCarousel.innerHTML = '';

            // 1. Filter only visible clients (Available or Occupied)
            let filteredData = clientData.filter(client => {
                const status = getClientStatus(client);
                return status === "Available" || status === "Occupied";
            });

            // 2. Sort numerically by ClientName (e.g., PC-01, PC-02, PC-03...)
            filteredClientData = filteredData.sort((a, b) => {
                const nameA = a.ClientName || '';
                const nameB = b.ClientName || '';
                return nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
            });

            // 3. Clamp selectedIndex within valid bounds
            if (selectedIndex >= filteredClientData.length) {
                selectedIndex = Math.max(0, filteredClientData.length - 1);
            }

            // 4. Render sorted cards
            filteredClientData.forEach((client, index) => {
                const status = getClientStatus(client);
                const statusClass = `status-${status.toLowerCase()}`;

                // Format dates
                const formattedStart = formatDateTimeString(client.TimeStart);
                const formattedEnd = formatDateTimeString(client.TimeEnd);

                const card = document.createElement('div');
                card.className = `psp-card ${index === selectedIndex ? 'active' : ''} ${statusClass}`;

                card.innerHTML = `
                <div class="pc-icon">💻</div>
                <div class="pc-title">${client.ClientName || `PC-${String(index + 1).padStart(2, '0')}`}</div>
                <div class="pc-details">
                    ${client.IPAddress ? `IP: ${client.IPAddress}<br>` : ''}
                    ${formattedStart ? `Start: ${formattedStart}<br>` : ''}
                    ${formattedEnd ? `End: ${formattedEnd}` : ''}
                </div>
                <div class="psp-badge ${statusClass}">
                    ${status}
                </div>
            `;

                card.addEventListener('click', () => {
                    if (Math.abs(currentDeltaX) < 10) {
                        selectedIndex = index;
                        updateCarouselPosition(0);
                    }
                });

                pspCarousel.appendChild(card);
            });

            requestAnimationFrame(() => updateCarouselPosition(0));
        }

        // --- ACCURATE CENTER CALCULATOR ---
        function updateCarouselPosition(extraOffset = 0) {
            const cards = document.querySelectorAll('.psp-card');
            if (cards.length === 0) return;

            cards.forEach((card, idx) => {
                if (idx === selectedIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            const screenWidth = window.innerWidth;
            const cardWidth = cards[0].offsetWidth;
            const gap = 20;

            const centerOffset = (screenWidth / 2) - (cardWidth / 2) - (selectedIndex * (cardWidth + gap));
            const totalTranslate = centerOffset + extraOffset;

            pspCarousel.style.transform = `translate3d(${totalTranslate}px, 0px, 0px)`;
            pspCarousel.style.webkitTransform = `translate3d(${totalTranslate}px, 0px, 0px)`;
        }

        // --- 5. TOUCH / SWIPE DRAG ENGINE ---
        let startX = 0;
        let currentDeltaX = 0;
        let isDragging = false;

        function onPointerDown(e) {
            if (filteredClientData.length === 0) return;
            isDragging = true;
            startX = e.clientX || (e.touches && e.touches[0].clientX);
            currentDeltaX = 0;
            pspCarousel.style.transition = 'none';
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const currentX = e.clientX || (e.touches && e.touches[0].clientX);
            currentDeltaX = currentX - startX;
            updateCarouselPosition(currentDeltaX);
        }

        function onPointerUp() {
            if (!isDragging) return;
            isDragging = false;

            pspCarousel.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            const swipeThreshold = window.innerWidth * 0.12;

            if (currentDeltaX < -swipeThreshold && selectedIndex < filteredClientData.length - 1) {
                selectedIndex++;
            } else if (currentDeltaX > swipeThreshold && selectedIndex > 0) {
                selectedIndex--;
            }

            updateCarouselPosition(0);
        }

        pspContainer.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        pspContainer.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        window.addEventListener('resize', () => updateCarouselPosition(0));
        window.addEventListener('orientationchange', () => setTimeout(() => updateCarouselPosition(0), 150));

        let isWheelCoolingDown = false;
        pspContainer.addEventListener('wheel', (e) => {
            if (filteredClientData.length === 0 || isWheelCoolingDown) return;

            if (e.deltaY > 0 || e.deltaX > 0) {
                if (selectedIndex < filteredClientData.length - 1) {
                    selectedIndex++;
                    updateCarouselPosition();
                }
            } else {
                if (selectedIndex > 0) {
                    selectedIndex--;
                    updateCarouselPosition();
                }
            }

            isWheelCoolingDown = true;
            setTimeout(() => { isWheelCoolingDown = false; }, 200);
        });

        // Single Keydown Listener
        document.addEventListener('keydown', (e) => {
            if (filteredClientData.length === 0) return;

            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                if (selectedIndex < filteredClientData.length - 1) {
                    selectedIndex++;
                    updateCarouselPosition();
                }
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                if (selectedIndex > 0) {
                    selectedIndex--;
                    updateCarouselPosition();
                }
            }
        });

        // --- 6. INITIALIZATION & SSE ---
        window.addEventListener('load', function () {
            const endpoint = window.location.protocol + '//' + window.location.hostname + ':2050/sse';
            let evtSource = null;

            try {
                evtSource = new EventSource(endpoint);

                evtSource.onmessage = function (event) {
                    fetchClientData();

                    const LinkButton_Refresh = document.querySelector('[id$="LinkButton_Refresh"]');
                    if (LinkButton_Refresh) {
                        LinkButton_Refresh.click();
                    }
                };

                evtSource.onerror = function (err) {
                    console.error('SSE Error/Disconnected:', err);
                };
            } catch (e) {
                console.error('Failed to initialize SSE:', e);
            }
        });
        function formatDateTimeString(dateStr) {
            if (!dateStr || dateStr.trim() === "") return "";

            // Check for 9999-12-31 date
            if (dateStr.includes("9999-12-31")) {
                return "∞";
            }

            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr; // Return original string if unparseable

            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            const month = months[d.getMonth()];
            const day = String(d.getDate()).padStart(2, '0');

            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12; // convert '0' to '12'
            const formattedHours = String(hours).padStart(2, '0');

            return `${month} ${day} – ${formattedHours}:${minutes} ${ampm}`;
        }

        discoverImages();
        fetchClientData();
    </script>
</body>
</html>
