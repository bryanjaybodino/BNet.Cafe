<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Cybercafe Station & Screen Monitoring</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6f9;
            --bg2: #ffffff;
            --bg3: #f0f2f5;
            --border: #dde1e7;
            --border2: #c4cad4;
            --text: #1a1d23;
            --text2: #5a6270;
            --text3: #9099a8;
            --accent: #2563eb;
            --accent-bg: rgba(37,99,235,.09);
            --green: #16a34a;
            --purple: #7c3aed;
            --amber: #d97706;
            --ease: cubic-bezier(.4,0,.2,1);
            --sidebar-w: 320px;
            --top-h: 52px;
        }

        html, body {
            height: 100%;
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-rows: var(--top-h) 1fr;
            grid-template-columns: 1fr;
            height: 100vh;
        }

            .app.has-selection {
                grid-template-columns: 1fr var(--sidebar-w);
            }

        .topbar {
            grid-column: 1/-1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            z-index: 30;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hamburger {
            display: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 800;
            font-size: 15px;
            color: var(--text);
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            animation: blink 2.4s infinite;
        }

        @keyframes blink {
            0%,100% {
                box-shadow: 0 0 0 3px var(--accent-bg)
            }

            50% {
                box-shadow: 0 0 0 6px transparent
            }
        }

        .main {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
            min-height: 0;
        }

        .sec-label {
            padding: 12px 16px 6px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text3);
        }

        .device-list {
            padding: 12px 16px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            align-content: start;
        }

        .no-devices {
            grid-column: 1 / -1;
            padding: 20px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text3);
            text-align: center;
        }

        .device-entry {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            background: var(--bg2);
            border: 1px solid var(--border);
            transition: all .14s var(--ease);
        }

            .device-entry:hover {
                background: var(--bg3);
                transform: translateY(-2px);
            }

            .device-entry.active {
                background: var(--accent-bg);
                border-color: var(--accent);
            }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
        }

        .device-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-sub {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            font-size: 10px;
            color: var(--text3);
            font-family: 'JetBrains Mono', monospace;
        }

        .activity-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: blink 2s infinite;
        }

        .sidebar {
            background: var(--bg2);
            border-left: 1px solid var(--border);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

            .sidebar.visible {
                display: flex;
            }

        .back-btn, .remote-launch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            margin: 12px 14px 4px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .remote-launch-btn {
            background: var(--accent);
            color: #fff;
            border: none;
        }

        .info-panel {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .info-scroll {
            padding: 0 12px 8px;
        }

        .info-row {
            padding: 7px 10px;
            border-radius: 7px;
        }

        .info-key {
            font-size: 9px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--text3);
        }

        .info-val {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
            word-break: break-all;
        }

        .sidebar-foot {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text3);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 25;
        }

            .overlay.open {
                display: block;
            }

        @media (max-width:850px) {
            .app {
                grid-template-columns: 1fr !important;
            }

                .app.has-selection .hamburger {
                    display: flex;
                }

            .sidebar {
                position: fixed;
                top: var(--top-h);
                right: 0;
                width: min(var(--sidebar-w), 85vw);
                height: calc(100vh - var(--top-h));
                z-index: 26;
                transform: translateX(110%);
                transition: transform .25s;
            }

                .sidebar.open {
                    transform: translateX(0);
                }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <div class="app" id="app">
        <header class="topbar">
            <div class="topbar-left">
                <div class="brand"><div class="brand-dot"></div><span>CyberCafe Manager</span></div>
            </div>
            <button class="hamburger" id="hamburger" title="Toggle details panel">☰</button>
        </header>

        <main class="main">
            <div class="sec-label">Computer Stations / Floor Map</div>
            <div class="device-list" id="deviceList">
                <div class="no-devices" id="noDevices">Waiting for connected PCs…</div>
            </div>
        </main>

        <aside class="sidebar" id="sidebar">
            <button class="back-btn" onclick="deselectDevice()">← Back to Stations</button>
            <a class="remote-launch-btn" id="remoteLaunchBtn" href="#">🖥 Launch Remote Control</a>
            <div class="info-panel" id="infoPanel">
                <div class="sec-label">Station Hardware & System</div>
                <div class="info-scroll">
                    <div class="info-row"><div class="info-key">Account Name</div><div class="info-val" id="Username">—</div></div>
                    <div class="info-row"><div class="info-key">Machine Name</div><div class="info-val" id="MachineName">—</div></div>
                    <div class="info-row"><div class="info-key">Workgroup</div><div class="info-val" id="Workgroup">—</div></div>
                    <div class="info-row"><div class="info-key">Windows</div><div class="info-val" id="Windows">—</div></div>
                    <div class="info-row"><div class="info-key">Windows Version</div><div class="info-val" id="WindowsVersion">—</div></div>
                    <div class="info-row"><div class="info-key">OS Version</div><div class="info-val" id="OSVersion">—</div></div>
                    <div class="info-row"><div class="info-key">Architecture</div><div class="info-val" id="OSArchitecture">—</div></div>
                    <div class="info-row"><div class="info-key">Serial Number</div><div class="info-val" id="SerialNumber">—</div></div>
                    <div class="info-row"><div class="info-key">Processor Count</div><div class="info-val" id="ProcessorCount">—</div></div>
                    <div class="info-row"><div class="info-key">Screen Count</div><div class="info-val" id="ScreenCount">—</div></div>
                </div>
            </div>
            <div class="sidebar-foot">⬡ &nbsp;<span id="clock">--:--:--</span></div>
        </aside>
    </div>

    <script>
        'use strict';
        var currentClient = '';
        var knownDevices = new Set();

        function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false }); }
        setInterval(tick, 1000); tick();

        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('overlay');
        var hamburger = document.getElementById('hamburger');
        var app = document.getElementById('app');

        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
        hamburger.addEventListener('click', function () { sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); });
        overlay.addEventListener('click', closeSidebar);

        function fetchDeviceData() {
            fetch('http://localhost:2050/text')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (Array.isArray(data)) {
                        renderDevices(data);
                        data.forEach(function (item) {
                            if (item.AccountName === currentClient) updateInfo(item);
                        });
                    }
                })
                .catch(function (err) { console.error('Error fetching text data:', err); });
        }

        function renderDevices(data) {
            var list = document.getElementById('deviceList');
            var incoming = new Set(data.map(function (item) { return item.AccountName; }));
            knownDevices.forEach(function (name) {
                if (!incoming.has(name)) {
                    knownDevices.delete(name);
                    var el = list.querySelector('.device-entry[data-name="' + name + '"]');
                    if (el) el.remove();
                    if (currentClient === name) deselectDevice();
                }
            });
            data.forEach(function (item) {
                var name = item.AccountName;
                if (knownDevices.has(name)) return;
                knownDevices.add(name);
                var ph = document.getElementById('noDevices'); if (ph) ph.remove();
                var el = document.createElement('div');
                el.className = 'device-entry'; el.dataset.name = name;
                el.innerHTML = '<div class="avatar">' + name.charAt(0).toUpperCase() + '</div><div><div class="device-name">' + name + '</div><div class="device-sub"><span class="activity-dot"></span>Online</div></div>';
                el.addEventListener('click', function () { selectDevice(name); });
                list.appendChild(el);
            });
            if (knownDevices.size === 0 && !document.getElementById('noDevices')) {
                var ph2 = document.createElement('div'); ph2.className = 'no-devices'; ph2.id = 'noDevices'; ph2.textContent = 'Waiting for connected PCs…'; list.appendChild(ph2);
            }
        }

        function selectDevice(name) {
            currentClient = name;
            document.querySelectorAll('.device-entry').forEach(function (el) { el.classList.toggle('active', el.dataset.name === name); });
            sidebar.classList.add('visible');
            app.classList.add('has-selection');
            document.getElementById('remoteLaunchBtn').href = 'remote.html?client=' + encodeURIComponent(name);
            fetchDeviceData();
            closeSidebar();
        }

        function deselectDevice() {
            currentClient = '';
            sidebar.classList.remove('visible');
            app.classList.remove('has-selection');
            document.querySelectorAll('.device-entry').forEach(function (el) { el.classList.remove('active'); });
        }

        function updateInfo(item) {
            document.getElementById('Username').textContent = item.AccountName || '—';
            document.getElementById('MachineName').textContent = item.MachineName || '—';
            document.getElementById('Workgroup').textContent = item.WorkGroup || '—';
            document.getElementById('Windows').textContent = item.Windows || '—';
            document.getElementById('WindowsVersion').textContent = item.WindowsVersion || '—';
            document.getElementById('OSVersion').textContent = item.OSVersion || '—';
            document.getElementById('OSArchitecture').textContent = item.OSArchitecture || '—';
            document.getElementById('SerialNumber').textContent = item.SerialNumber || '—';
            document.getElementById('ProcessorCount').textContent = item.ProcessorCount || '—';
            document.getElementById('ScreenCount').textContent = item.ScreenCount || '—';
        }

        fetchDeviceData();
        setInterval(fetchDeviceData, 3000);
    </script>
</body>
</html>
