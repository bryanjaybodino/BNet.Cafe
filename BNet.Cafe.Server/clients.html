<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNet Cafe Manager Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

            .status.connected {
                background-color: #1b5e20;
                color: #a5d6a7;
            }

            .status.disconnected {
                background-color: #b71c1c;
                color: #ef9a9a;
            }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .client-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

            .client-card:hover {
                transform: translateY(-3px);
                border-color: #00bcd4;
            }

            .client-card h3 {
                color: #00bcd4;
                margin-bottom: 10px;
                font-size: 18px;
                border-bottom: 1px solid #2a2a2a;
                padding-bottom: 5px;
            }

        .client-info p {
            font-size: 13px;
            color: #b0bec5;
            margin-bottom: 5px;
        }

        .client-info strong {
            color: #ffffff;
        }

        .stream-container {
            margin-top: 10px;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            position: relative;
        }

            .stream-container img {
                width: 100%;
                height: auto;
                display: block;
            }

            .stream-container .loading {
                position: absolute;
                color: #666;
                font-size: 12px;
            }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #757575;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

            .modal-overlay.active {
                display: flex;
            }

        .modal-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            color: #00bcd4;
            font-size: 20px;
            font-weight: bold;
        }

        .close-btn {
            padding: 8px 18px;
            background-color: #b71c1c;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }

            .close-btn:hover {
                background-color: #d32f2f;
            }

        .modal-body {
            width: 95vw;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

            .modal-body img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border: 1px solid #333;
                box-shadow: 0 0 20px rgba(0, 188, 212, 0.2);
            }

            .modal-body .loading {
                position: absolute;
                color: #666;
                font-size: 16px;
            }
    </style>
</head>
<body>

    <header>
        <h1>BNet Cafe Clients</h1>
        <div id="connectionStatus" class="status disconnected">Disconnected</div>
    </header>

    <main class="grid" id="clientGrid">
        <div class="empty-state">Connecting to server...</div>
    </main>

    <div id="fullscreenModal" class="modal-overlay">
        <div class="modal-header">
            <div id="modalTitle" class="modal-title">Client PC Screen</div>
            <button class="close-btn" onclick="closeFullscreen()">Close (ESC)</button>
        </div>
        <div class="modal-body">
            <div class="loading">Waiting for screen data...</div>
            <img id="fullscreenImg" alt="Waiting for screen stream..." style="display: none;" />
        </div>
    </div>

    <script>
        const SERVER_URL = "ws://localhost:2050";
        let socket;
        let activeFullscreenAgent = null;

        const clientFrames = {};
        const clientInfo = {};

        function connectWebSocket() {
            socket = new WebSocket(SERVER_URL);
            socket.binaryType = 'arraybuffer';

            socket.onopen = () => {
                console.log("Connected to WebSocket Server");
                updateStatus(true);

                const requestPayload = new Uint8Array([0x11]);
                socket.send(requestPayload);

                setInterval(() => {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const heartbeat = new Uint8Array([0x22]);
                        socket.send(heartbeat);
                    }
                }, 30000);
            };

            socket.onclose = () => {
                console.log("Disconnected from server");
                updateStatus(false);
                setTimeout(connectWebSocket, 2000);
            };

            socket.onerror = (err) => {
                console.error("WebSocket Error:", err);
            };

            socket.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    processBinaryMessage(new Uint8Array(event.data));
                }
            };
        }

        function processBinaryMessage(data) {
            if (data.length === 0) return;

            const msgType = data[0];

            switch (msgType) {
                case 0x11:
                    handleClientListResponse(data);
                    break;

                case 0x10:
                case 0x01:
                    handleScreenFrame(data);
                    break;

                case 0x12:
                    console.log("Activity received");
                    break;
            }
        }

        function handleClientListResponse(data) {
            const textData = new TextDecoder('utf-8').decode(data.subarray(1));

            try {
                const clients = JSON.parse(textData);
                renderClients(clients);

                if (clients && Array.isArray(clients)) {
                    clients.forEach(client => {
                        const safeName = (client.AccountName || client.accountName || '').toLowerCase();
                        clientInfo[safeName] = client;
                    });
                }
            } catch (err) {
                console.error("Failed to parse client JSON:", err);
            }
        }

        function handleScreenFrame(data) {
            try {
                const view = new DataView(data.buffer, data.byteOffset, data.byteLength);

                const keyLen = view.getUint32(1, true);

                const keyBytes = data.subarray(5, 5 + keyLen);
                const screenKey = new TextDecoder('utf-8').decode(keyBytes).toLowerCase();

                const jpegBytes = data.subarray(5 + keyLen);
                if (!jpegBytes || jpegBytes.length === 0) {
                    return;
                }

                const agentName = parseAgentNameFromScreenKey(screenKey);
                if (!agentName) return;

                const blob = new Blob([jpegBytes], { type: 'image/jpeg' });
                const imageUrl = URL.createObjectURL(blob);

                if (clientFrames[agentName] && clientFrames[agentName].startsWith('blob:')) {
                    URL.revokeObjectURL(clientFrames[agentName]);
                }

                clientFrames[agentName] = imageUrl;

                updateThumbnail(agentName, imageUrl);

                if (activeFullscreenAgent === agentName) {
                    updateFullscreenImage(imageUrl);
                }
            } catch (err) {
                console.error("Error processing screen frame:", err);
            }
        }

        function parseAgentNameFromScreenKey(screenKey) {
            if (!screenKey) return null;

            const parts = screenKey.split('_');
            let agentName = '';

            if (parts.length >= 3) {
                agentName = parts.slice(2).join('_');
            } else if (parts.length === 2) {
                agentName = parts[1];
            } else {
                agentName = screenKey;
            }

            return agentName.toLowerCase();
        }

        function updateThumbnail(agentName, imageUrl) {
            const img = document.getElementById(`stream_${agentName}`);
            const card = img ? img.closest('.client-card') : null;
            if (!img) return;

            img.src = imageUrl;
            img.style.display = 'block';

            if (card) {
                const loading = card.querySelector('.loading');
                if (loading) loading.style.display = 'none';
            }
        }

        function updateFullscreenImage(imageUrl) {
            const fullImg = document.getElementById('fullscreenImg');
            const loadingDiv = document.querySelector('.modal-body .loading');

            if (!fullImg) return;

            fullImg.src = imageUrl;
            fullImg.style.display = 'block';

            if (loadingDiv) {
                loadingDiv.style.display = 'none';
            }
        }

        function renderClients(clients) {
            const grid = document.getElementById('clientGrid');
            grid.innerHTML = '';

            if (!clients || clients.length === 0) {
                grid.innerHTML = '<div class="empty-state">No client machines connected.</div>';
                return;
            }

            clients.forEach(client => {
                const accountName = client.accountName || client.AccountName || 'Unknown Machine';
                const machineName = client.machineName || client.MachineName || 'N/A';
                const os = client.windows || client.Windows || client.osVersion || client.OSVersion || 'N/A';
                const arch = client.osArchitecture || client.OSArchitecture || 'N/A';
                const screens = client.screenCount || client.ScreenCount || '1';

                const safeName = accountName.toLowerCase();
                const card = document.createElement('div');
                card.className = 'client-card';
                card.onclick = () => openFullscreen(accountName);

                card.innerHTML = `
                <h3>${accountName}</h3>
                    <div class="client-info">
                        <p><strong>Machine Name:</strong> ${machineName}</p>
                        <p><strong>OS:</strong> ${os}</p>
                        <p><strong>Arch:</strong> ${arch}</p>
                        <p><strong>Screens:</strong> ${screens}</p>
                    </div>
                    <div class="stream-container">
                        <div class="loading">Waiting for stream...</div>
                        <img id="stream_${safeName}" alt="Click to View Screen" style="display: none;" />
                    </div>
                `;

                grid.appendChild(card);

                if (clientFrames[safeName]) {
                    const img = card.querySelector(`#stream_${safeName}`);
                    const loading = card.querySelector('.loading');
                    if (img && loading) {
                        img.src = clientFrames[safeName];
                        img.style.display = 'block';
                        loading.style.display = 'none';
                    }
                }
            });
        }

        function openFullscreen(accountName) {
            if (!accountName) return;

            activeFullscreenAgent = accountName.toLowerCase();
            document.getElementById('modalTitle').textContent = `Live View - ${accountName}`;
            document.getElementById('fullscreenModal').classList.add('active');

            const fullImg = document.getElementById('fullscreenImg');
            const loadingDiv = document.querySelector('.modal-body .loading');
            fullImg.style.display = 'none';
            loadingDiv.style.display = 'block';

            if (clientFrames[activeFullscreenAgent]) {
                updateFullscreenImage(clientFrames[activeFullscreenAgent]);
            }

            if (socket && socket.readyState === WebSocket.OPEN) {
                const payload = new TextEncoder().encode(activeFullscreenAgent);
                const fullPayload = new Uint8Array([0x21, ...payload]);
                socket.send(fullPayload);
            }
        }

        function closeFullscreen() {
            activeFullscreenAgent = null;
            document.getElementById('fullscreenModal').classList.remove('active');

            const fullImg = document.getElementById('fullscreenImg');
            fullImg.src = '';
            fullImg.style.display = 'none';
        }

        function updateStatus(isConnected) {
            const statusDiv = document.getElementById('connectionStatus');
            if (isConnected) {
                statusDiv.textContent = 'Connected';
                statusDiv.className = 'status connected';
            } else {
                statusDiv.textContent = 'Disconnected';
                statusDiv.className = 'status disconnected';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFullscreen();
        });

        window.onload = connectWebSocket;
    </script>
</body>
</html>
